name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Every integration test is its own statically linked binary; with full
  # debuginfo the sqlite arm outgrew the runner disk and ld died with
  # SIGBUS. Line tables keep backtraces readable at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default build is postgres; its DB-backed tests are sqlite-gated,
          # so both arms run — neither one alone covers the suite.
          - name: postgres
            flags: ""
          - name: sqlite
            flags: "--features sqlite"
    steps:
      - name: free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
      - run: cargo test --workspace ${{ matrix.flags }}

  features:
    name: feature builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: features
      - name: every backend and optional feature compiles
        run: |
          set -e
          for f in postgres mysql sqlite "sqlite,mysql" "postgres,mysql,sqlite" \
                   "sqlite,test_utils" "postgres,test_utils" "sqlite,storage_s3" \
                   "sqlite,cache_cloudflare" "sqlite,cache_varnish" "sqlite,cache_cloudfront" \
                   "sqlite,cache_gcp" "sqlite,cache_azure" "sqlite,search_elasticsearch"; do
            echo "::group::--no-default-features --features $f"
            cargo check --workspace --all-targets --no-default-features --features "$f"
            echo "::endgroup::"
          done

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      # Correctness and suspicious lints are errors. The style/doc backlog
      # (~150 warnings) is reported but not yet gated.
      - run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ignores, each with its reason, live in .cargo/audit.toml.
      - run: cargo audit

  licenses:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Policy and the reason for each allowed licence live in deny.toml.
      - run: cargo deny check licenses bans sources

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: actions/setup-node@v7
        with:
          # The API fixture imports node:sqlite (unflagged from 22.13).
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # The suite reaches the tenant as demo.localhost; Linux resolves only
      # plain localhost by default.
      - run: echo "127.0.0.1 demo.localhost" | sudo tee -a /etc/hosts
      - working-directory: e2e
        run: npm ci
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
      - working-directory: e2e
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
