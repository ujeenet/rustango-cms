{#- BoolBlock renders nothing by default — the boolean is
    a flag for upstream templates / hooks. Hosts override this
    template to react to value.value being true/false. -#}
{%- if value.value -%}
<span class="rcms-block-boolean rcms-block-boolean--on" data-value="true"></span>
{%- else -%}
<span class="rcms-block-boolean rcms-block-boolean--off" data-value="false"></span>
{%- endif -%}
