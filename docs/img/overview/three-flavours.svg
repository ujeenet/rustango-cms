<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t d">
  <title id="t">Three ways to make pages</title>
  <desc id="d">A line from "fixed, made in code" to "free, made by editors", with three cards: model-based page types, page types built in the admin, and content constructors.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#6f4a33"/>
      <stop offset="1" stop-color="#e3905f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3c2814" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#faf6ee"/>

  <!-- the freedom line -->
  <text x="80" y="70" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="2" fill="#6f4a33">FIXED · MADE IN CODE</text>
  <text x="1120" y="70" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="2" fill="#b0522a" text-anchor="end">FREE · MADE BY EDITORS</text>
  <rect x="80" y="92" width="1040" height="8" rx="4" fill="url(#line)"/>
  <circle cx="220" cy="96" r="13" fill="#faf6ee" stroke="#6f4a33" stroke-width="5"/>
  <circle cx="600" cy="96" r="13" fill="#faf6ee" stroke="#a8663f" stroke-width="5"/>
  <circle cx="980" cy="96" r="13" fill="#faf6ee" stroke="#e3905f" stroke-width="5"/>

  <!-- card 1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="320" height="380" rx="22" fill="#fffdf8" stroke="#e6dac8"/>
  </g>
  <rect x="92" y="172" width="54" height="54" rx="14" fill="#6f4a33"/>
  <text x="119" y="208" font-size="26" fill="#fff" text-anchor="middle" font-family="Menlo, monospace">{ }</text>
  <text x="92" y="268" font-size="30" fill="#2b241f">Model-based</text>
  <text x="92" y="302" font-size="30" fill="#2b241f">page types</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6f6357">
    <text x="92" y="346">A developer writes the type</text>
    <text x="92" y="370">in Rust. Its own database</text>
    <text x="92" y="394">table, fixed fields.</text>
  </g>
  <text x="92" y="448" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6f4a33">WHO: DEVELOPER</text>
  <text x="92" y="478" font-family="Menlo, monospace" font-size="15" fill="#6f4a33">#[derive(PageType)]</text>

  <!-- card 2 -->
  <g filter="url(#shadow)">
    <rect x="440" y="140" width="320" height="380" rx="22" fill="#fffdf8" stroke="#e6dac8"/>
  </g>
  <rect x="472" y="172" width="54" height="54" rx="14" fill="#a8663f"/>
  <g fill="#fff">
    <rect x="484" y="186" width="30" height="6" rx="3"/>
    <rect x="484" y="197" width="30" height="6" rx="3"/>
    <rect x="484" y="208" width="18" height="6" rx="3"/>
  </g>
  <text x="472" y="268" font-size="30" fill="#2b241f">Page types built</text>
  <text x="472" y="302" font-size="30" fill="#2b241f">in the admin</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6f6357">
    <text x="472" y="346">Design the fields in the</text>
    <text x="472" y="370">Page Builder, then publish.</text>
    <text x="472" y="394">No code, no new tables.</text>
  </g>
  <text x="472" y="448" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#a8663f">WHO: SITE MANAGER</text>
  <text x="472" y="478" font-family="Menlo, monospace" font-size="15" fill="#a8663f">Page types → Build fields</text>

  <!-- card 3 -->
  <g filter="url(#shadow)">
    <rect x="820" y="140" width="320" height="380" rx="22" fill="#fffdf8" stroke="#e6dac8"/>
  </g>
  <rect x="852" y="172" width="54" height="54" rx="14" fill="#e3905f"/>
  <g fill="#fff">
    <rect x="864" y="184" width="13" height="13" rx="3"/>
    <rect x="881" y="184" width="13" height="13" rx="3"/>
    <rect x="864" y="201" width="30" height="13" rx="3"/>
  </g>
  <text x="852" y="268" font-size="30" fill="#2b241f">Content</text>
  <text x="852" y="302" font-size="30" fill="#2b241f">constructors</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6f6357">
    <text x="852" y="346">Editors build each page</text>
    <text x="852" y="370">from blocks: headings,</text>
    <text x="852" y="394">photos, quotes, forms…</text>
  </g>
  <text x="852" y="448" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#b0522a">WHO: EDITOR</text>
  <text x="852" y="478" font-family="Menlo, monospace" font-size="15" fill="#b0522a">+ Add block</text>
</svg>
