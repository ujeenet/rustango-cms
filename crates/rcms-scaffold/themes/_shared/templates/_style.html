{#- Shared starter styles. Every colour, font, radius and shadow is a
    theme variable, so a site restyles from the admin (Settings → Theme);
    each theme adds its own touches in _theme.css.html. -#}
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --wrap: 72rem;
    --measure: 42rem;
    --gap: clamp(1rem, 3vw, 2rem);
    --accent: var(--color-link, #2f6fdd);
    --fg: var(--color-text-primary, #1b1b1f);
    --fg-2: var(--color-text-secondary, #45464f);
    --fg-3: var(--color-text-muted, #6b6c75);
    --bg: var(--color-bg, #ffffff);
    --bg-2: var(--color-surface, #f6f7f9);
    --line: var(--color-border, #e3e4e8);
    --r-sm: var(--radius-sm, 6px);
    --r-md: var(--radius-md, 10px);
    --r-lg: var(--radius-lg, 16px);
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body, system-ui, sans-serif);
    font-size: 1.0625rem;
    line-height: 1.65;
    /* Full-width blocks reach the window edges without a sideways scroll. */
    overflow-x: clip;
  }
  h1, h2, h3, h4 {
    font-family: var(--font-heading, inherit);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 0.5em;
  }
  h1 { font-size: clamp(2rem, 5vw, 3.25rem); }
  h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
  h3 { font-size: 1.25rem; }
  p { margin: 0 0 1em; }
  a { color: var(--accent); text-underline-offset: 0.15em; }
  img { max-width: 100%; height: auto; display: block; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gap); }
  .measure { max-width: var(--measure); }

  /* Header */
  .site-header { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .site-header__inner { display: flex; align-items: center; gap: 1.5rem; min-height: 4rem; flex-wrap: wrap; }
  .site-brand { text-decoration: none; color: var(--fg); display: flex; align-items: center; gap: 0.75rem; margin-right: auto; }
  .site-brand__logo { width: 40px; height: 40px; object-fit: contain; flex: none; }
  .site-brand__name { font-family: var(--font-heading, inherit); font-weight: 700; font-size: 1.25rem; }
  .site-brand__tagline { color: var(--fg-3); font-size: 0.875rem; }
  .site-nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 0.25rem; flex-wrap: wrap; }
  .site-nav li { position: relative; }
  .site-nav a, .site-nav span { display: block; padding: 0.5rem 0.75rem; border-radius: var(--r-sm); color: var(--fg-2); text-decoration: none; font-weight: 500; }
  .site-nav a:hover, .site-nav a[aria-current], .site-nav a.is-trail { color: var(--fg); background: var(--bg-2); }
  .site-nav li ul { display: none; position: absolute; top: 100%; left: 0; min-width: 12rem; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 0.375rem; box-shadow: var(--shadow-md, 0 8px 24px rgb(0 0 0 / 0.08)); }
  .site-nav li:hover > ul, .site-nav li:focus-within > ul { display: flex; }
  .site-langs { display: flex; gap: 0.5rem; font-size: 0.875rem; }
  .site-langs a { color: var(--fg-3); text-decoration: none; }
  .site-langs a[aria-current] { color: var(--fg); font-weight: 600; }

  main { padding: clamp(2rem, 6vw, 4rem) 0; min-height: 60vh; }

  /* Page heads */
  .page-head { margin-bottom: clamp(1.5rem, 4vw, 2.5rem); }
  .page-head__kicker { color: var(--accent); font-weight: 600; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
  .page-head__intro { font-size: 1.25rem; color: var(--fg-2); max-width: var(--measure); }
  .meta { color: var(--fg-3); font-size: 0.9375rem; display: flex; gap: 0.5rem 1.25rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .meta dt { display: inline; font-weight: 600; color: var(--fg-2); }
  .meta dd { display: inline; margin: 0 0 0 0.25rem; }

  /* Hero */
  .hero { padding: clamp(2rem, 8vw, 5rem) 0 clamp(1.5rem, 5vw, 3rem); }
  .hero h1 { font-size: clamp(2.5rem, 7vw, 4.5rem); max-width: 18ch; }
  .hero p { font-size: 1.25rem; color: var(--fg-2); max-width: var(--measure); }
  .button { display: inline-block; padding: 0.75rem 1.25rem; border-radius: var(--r-md); background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
  .button:hover { filter: brightness(1.08); }

  /* Covers and cards */
  .cover { border-radius: var(--r-lg); overflow: hidden; margin: 0 0 2rem; background: var(--bg-2); }
  .cover img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
  .placeholder { aspect-ratio: 16 / 9; background:
      radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 55%),
      radial-gradient(circle at 80% 70%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 50%),
      var(--bg-2); }
  .cards { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); }
  .card { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--bg); text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md, 0 10px 30px rgb(0 0 0 / 0.08)); }
  .card__media img, .card__media .placeholder { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  .card__body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
  .card__kicker { color: var(--fg-3); font-size: 0.8125rem; }
  .card h3 { margin: 0; }
  .card p { margin: 0; color: var(--fg-2); }
  /* The featured story at the top of a news section. */
  .card--lead { display: grid; grid-template-columns: 3fr 2fr; margin-bottom: 1rem; }
  .card--lead h2 { font-size: clamp(1.5rem, 3vw, 2.25rem); margin: 0; }
  .card--lead .card__media .placeholder, .card--lead .card__media img { height: 100%; aspect-ratio: auto; min-height: 16rem; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { border-top: 1px solid var(--line); }
  .list a { display: block; padding: 0.75rem 0; text-decoration: none; color: var(--fg); font-weight: 500; }
  .list a:hover { color: var(--accent); }
  .section { margin-top: clamp(2.5rem, 6vw, 4rem); }
  .section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; border-bottom: 2px solid var(--fg); padding-bottom: 0.5rem; }
  .section__head h2 { margin: 0; }

  /* Content blocks (the flexible "Content" field) */
  .prose { max-width: var(--measure); }
  .prose > * + * { margin-top: 1.25rem; }
  .prose h2 { margin-top: 2.5rem; }
  .prose blockquote, .rcms-block-quote { margin: 2rem 0; padding: 0.25rem 0 0.25rem 1.25rem; border-left: 3px solid var(--accent); font-size: 1.25rem; color: var(--fg-2); }
  .rcms-block-quote cite { display: block; margin-top: 0.5rem; font-size: 0.9375rem; color: var(--fg-3); font-style: normal; }
  .rcms-block-image { margin: 2rem 0; }
  .rcms-block-image img { border-radius: var(--r-md); }
  .rcms-block-image figcaption { color: var(--fg-3); font-size: 0.875rem; margin-top: 0.5rem; }
  .cta { margin: 2.5rem 0; padding: clamp(1.5rem, 4vw, 2.5rem); border-radius: var(--r-lg); background: var(--bg-2); border: 1px solid var(--line); }
  .cta h2 { margin-top: 0; }
  .cta p { color: var(--fg-2); }

  /* Layout blocks of the Content field. Jumbo boxes and media-and-text
     use the full page width, hero images the full window width, so they
     leave the narrower reading column. */
  .hero-block, .jumbo, .media-text, .rcms-block-cards, .rcms-block-slider, .rcms-block-gallery { margin: clamp(2rem, 6vw, 4rem) 0; }
  .prose .hero-block h2, .prose .jumbo h2, .prose .media-text h2, .prose .rcms-block-cards h2, .prose .rcms-block-slider h2 { margin-top: 0; }
  .jumbo, .media-text, .rcms-block-cards, .rcms-block-slider, .rcms-block-gallery { width: calc(min(100vw, var(--wrap)) - 2 * var(--gap)); max-width: none; }

  .hero-block { position: relative; display: grid; align-items: end; overflow: hidden; width: 100vw; margin-left: calc((min(100vw, var(--wrap)) - 100vw) / 2 - var(--gap)); color: #fff; background: #111; }
  .hero-block--medium { min-height: clamp(20rem, 55vh, 34rem); }
  .hero-block--tall { min-height: clamp(26rem, 85vh, 52rem); }
  .hero-block__image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-block::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(0 0 0 / 0.7), rgb(0 0 0 / 0.15) 65%); }
  .hero-block--plain { background:
      radial-gradient(circle at 15% 20%, rgb(255 255 255 / 0.22), transparent 50%),
      radial-gradient(circle at 85% 80%, rgb(0 0 0 / 0.25), transparent 55%),
      var(--accent); }
  .hero-block--plain::after { display: none; }
  .hero-block__inner { position: relative; z-index: 1; width: 100%; max-width: var(--wrap); margin: 0 auto; padding: clamp(2rem, 6vw, 4rem) var(--gap); }
  .hero-block__heading { color: inherit; font-size: clamp(2rem, 6vw, 3.75rem); max-width: 20ch; margin-bottom: 0.5rem; }
  .hero-block__text { font-size: clamp(1.0625rem, 2vw, 1.25rem); max-width: var(--measure); opacity: 0.92; }
  .hero-block .button { background: #fff; color: #111; }

  .jumbo { padding: clamp(2rem, 7vw, 5rem) clamp(1.5rem, 6vw, 4.5rem); border-radius: var(--r-lg); text-align: center; }
  .jumbo__heading { color: inherit; font-size: clamp(1.875rem, 5vw, 3.25rem); max-width: 22ch; margin: 0 auto 0.75rem; }
  .jumbo__text { font-size: 1.1875rem; max-width: var(--measure); margin: 0 auto 1.5rem; }
  .jumbo__text:last-child { margin-bottom: 0; }
  .jumbo--accent { background: var(--accent); color: var(--bg); }
  .jumbo--accent .button { background: var(--bg); color: var(--accent); }
  .jumbo--soft { background: var(--bg-2); border: 1px solid var(--line); }
  .jumbo--soft .jumbo__text { color: var(--fg-2); }
  .jumbo--dark { background: var(--fg); color: var(--bg); }

  .media-text { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(1.5rem, 5vw, 4rem); align-items: center; }
  .media-text--right .media-text__media { order: 2; }
  .media-text__media img, .media-text__media .placeholder { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-lg); }
  .media-text__text { color: var(--fg-2); }
  .media-text__text > :last-child { margin-bottom: 0; }
  .media-text__text + p { margin: 1.5rem 0 0; }
  @media (max-width: 48rem) {
    .media-text { grid-template-columns: 1fr; }
    .media-text--right .media-text__media { order: 0; }
  }

  /* Cards */
  .rcms-block-cards__list { --cols: 3; list-style: none; margin: 0; padding: 0; display: grid; gap: var(--gap); grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
  .rcms-block-cards--2 .rcms-block-cards__list { --cols: 2; }
  .rcms-block-cards--4 .rcms-block-cards__list { --cols: 4; }
  .rcms-card { position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); transition: transform .15s ease, box-shadow .15s ease; }
  .rcms-card:has(a):hover { transform: translateY(-2px); box-shadow: var(--shadow-md, 0 10px 30px rgb(0 0 0 / 0.08)); }
  .rcms-card__image { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  .rcms-card__body { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; padding: 1.25rem; }
  .rcms-card__title { margin: 0; font-size: 1.25rem; }
  .rcms-card__title a { color: inherit; text-decoration: none; }
  .rcms-card__title a::after { content: ""; position: absolute; inset: 0; }
  .rcms-card__text { margin: 0; color: var(--fg-2); }
  .rcms-card__link { margin-top: auto; padding-top: 0.5rem; font-weight: 600; }
  @media (max-width: 60rem) { .rcms-block-cards__list { --cols: 2; } }
  @media (max-width: 40rem) { .rcms-block-cards__list { --cols: 1; } }

  /* Slider: a sideways-scrolling track; the layout adds previous/next. */
  .rcms-block-slider__track { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: thin; border-radius: var(--r-lg); }
  .rcms-block-slider--scroller .rcms-block-slider__track { grid-auto-columns: min(80%, 22rem); padding-bottom: 0.5rem; }
  .rcms-block-slider__track:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .rcms-slide { position: relative; margin: 0; overflow: hidden; scroll-snap-align: start; border-radius: var(--r-lg); background: var(--bg-2); }
  .rcms-slide__heading { margin: 0 0 0.25rem; color: inherit; }
  .rcms-slide__text { margin: 0 0 0.75rem; }
  .rcms-slide__text:last-child { margin-bottom: 0; }
  .rcms-block-slider--slides .rcms-slide { display: grid; align-items: end; min-height: clamp(18rem, 45vw, 32rem); color: #fff; background: #111; }
  .rcms-block-slider--slides .rcms-slide--plain { background:
      radial-gradient(circle at 15% 20%, rgb(255 255 255 / 0.22), transparent 50%),
      radial-gradient(circle at 85% 80%, rgb(0 0 0 / 0.25), transparent 55%),
      var(--accent); }
  .rcms-block-slider--slides .rcms-slide__image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .rcms-block-slider--slides .rcms-slide__caption { position: relative; padding: clamp(1.5rem, 4vw, 3rem); background: linear-gradient(to top, rgb(0 0 0 / 0.7), transparent); }
  .rcms-block-slider--slides .rcms-slide--plain .rcms-slide__caption { background: none; }
  .rcms-block-slider--slides .rcms-slide__heading { font-size: clamp(1.5rem, 4vw, 2.5rem); }
  .rcms-block-slider--slides .button { background: #fff; color: #111; }
  .rcms-block-slider--scroller .rcms-slide__image { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .rcms-block-slider--scroller .rcms-slide__caption { padding: 1rem 1.25rem 1.25rem; }
  .rcms-block-slider--scroller .rcms-slide__text { color: var(--fg-2); }
  .slider-nav { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.75rem; }
  .slider-nav button { width: 2.75rem; height: 2.75rem; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); color: var(--fg); font-size: 1.25rem; line-height: 1; cursor: pointer; }
  .slider-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .slider-nav button:disabled { opacity: 0.4; cursor: default; }

  /* Gallery */
  .rcms-block-gallery__grid { --cols: 3; list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
  .rcms-block-gallery--2 .rcms-block-gallery__grid { --cols: 2; }
  .rcms-block-gallery--4 .rcms-block-gallery__grid { --cols: 4; }
  .rcms-block-gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-md); transition: opacity .15s ease; }
  .rcms-block-gallery a:hover img { opacity: 0.88; }
  .rcms-block-gallery__caption { display: block; margin-top: 0.375rem; font-size: 0.875rem; color: var(--fg-3); }
  .rcms-block-gallery > figcaption { margin-top: 0.75rem; font-size: 0.875rem; color: var(--fg-3); }
  @media (max-width: 40rem) { .rcms-block-gallery__grid { --cols: 2; } }

  /* Error pages (404, 500, …) */
  .error-page { padding: clamp(3rem, 12vw, 7rem) var(--gap); text-align: center; }
  .error-page__code { margin: 0; font-family: var(--font-heading, inherit); font-size: clamp(4.5rem, 16vw, 8rem); font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: var(--accent); }
  .error-page h1 { margin: 0.75rem 0 1rem; }
  .error-page__body { margin: 0 auto; color: var(--fg-2); }
  .error-page__actions { margin-top: 2rem; }

  /* Footer */
  .site-footer { border-top: 1px solid var(--line); background: var(--bg-2); padding: 3rem 0 2rem; color: var(--fg-2); }
  .footer-nav { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); margin-bottom: 2rem; }
  .footer-nav h2 { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg); margin-bottom: 0.75rem; }
  .footer-nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.375rem; }
  .footer-nav a { color: var(--fg-2); text-decoration: none; }
  .footer-nav a:hover { color: var(--accent); }
  .site-footer__logo { display: block; width: 96px; height: 96px; margin-top: 1.25rem; opacity: 0.9; }
  .site-footer__note { font-size: 0.875rem; color: var(--fg-3); margin: 0; }

  @media (max-width: 48rem) { .card--lead { grid-template-columns: 1fr; } }
  @media (max-width: 40rem) {
    .site-brand__tagline { display: none; }
    .site-nav li ul { position: static; box-shadow: none; border: 0; padding-left: 0.75rem; }
  }
</style>
