{% extends "_base.html" %}
{% block content %}
<article class="mx-auto max-w-3xl">
    <h1 class="font-display text-5xl leading-tight text-ink">{{ page.title }}</h1>
    {% if page.seo_description %}<p class="mt-4 text-lg text-ink/65">{{ page.seo_description }}</p>{% endif %}
    {% if extension.photo %}<img src="{{ rcms_image_url(media_id=extension.photo, filter="fill-1600x900") }}" alt="" class="mt-10 w-full rounded-3xl object-cover">{% endif %}
    <div class="prose-shop mt-10 text-lg">{{ _stream_html['body'] | default(value="") | safe }}</div>
</article>
{% endblock %}
