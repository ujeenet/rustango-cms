{#- TypedTableBlock — one row's HTML fragment.
    Used by `typed_table.html`'s row walker; hosts who subclass with
    a custom row schema override this file per-site. -#}
<tr class="rcms-block-typed-table-row">
    <td>{{ value.label | default(value="") }}</td>
    <td>{{ value.value | default(value="") }}</td>
    <td>{{ value.notes | default(value="") }}</td>
</tr>
