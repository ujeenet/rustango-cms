[package]
name = "rcms-scaffold"
version = "0.1.0"
description = "`rcms new <project>` — scaffold a new rustango-cms project"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
# Not publishable yet: the skeleton and baseline migrations are embedded with
# include_str! from outside this crate, and generated projects depend on
# rustango-cms by path until rustango-cms itself is on crates.io.
publish = false

# Standalone bin: no dependency on rustango-cms (or its heavy build tree).
# The skeleton + the CMS baseline migrations are embedded via include_str!
# from the repo, so the scaffolder compiles in seconds.
[[bin]]
name = "rcms"
path = "src/main.rs"

[lints]
workspace = true
