# Documentation table of contents.
#
# rustangodocs reads this manifest to seed the docs site: each [[section]]
# becomes a nav section, and every page (a markdown file in this directory)
# becomes one documentation page, rendered in the order listed here.
#
# Files not listed below are NOT published. That's deliberate — this
# directory also holds internal design notes (i18n-decision.md, logging.md,
# …) that are working documents, not user-facing docs. Add a file here only
# when it has been written, run, and screenshotted end to end.

