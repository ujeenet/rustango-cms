name: fresh install

# Builds a brand-new project against the newest rustango-cms on crates.io,
# with no lockfile, the way a new user starts. The repo's own CI builds from
# Cargo.lock, so it cannot see a framework patch release that breaks the
# published crate (rustango 0.60.7 and 0.61.14 both did). The `windows` job
# runs a new user's whole first session on Windows, in PowerShell. The
# scaffolder is installed the way the docs say, `cargo install rcms-scaffold`.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: "crates (the published crate) or checkout (this repo, unpublished)"
        default: crates
        type: choice
        options: [crates, checkout]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fresh:
    name: fresh install (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres, mysql]
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: new project depending on the published crate
        run: |
          cargo new --bin fresh && cd fresh
          cargo add rustango-cms --no-default-features --features ${{ matrix.backend }}
      - name: build with whatever crates.io resolves today
        working-directory: fresh
        run: |
          cargo generate-lockfile
          grep -A1 -E '^name = "rustango(-cms)?"$' Cargo.lock
          cargo check

  themes:
    # Every starter theme, as a new user gets it: generate, quickstart,
    # then load every page the theme created.
    name: theme ${{ matrix.theme }} (${{ inputs.source || 'crates' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme: [blog, news, portfolio, blog-portfolio]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install the scaffolder
        run: |
          # As a new user does: from crates.io, no clone. With source=checkout,
          # this repo's unpublished scaffolder instead.
          if [ "${{ inputs.source }}" = "checkout" ]; then
            cargo install --locked --path crates/rcms-scaffold
          else
            cargo install --locked rcms-scaffold
          fi
          rcms --version
      - name: generate a project
        run: |
          local_flag=""
          if [ "${{ inputs.source }}" = "checkout" ]; then local_flag="--local"; fi
          rcms new site --dir "$RUNNER_TEMP" --theme ${{ matrix.theme }} $local_flag
      - name: quickstart and load every page
        working-directory: ${{ runner.temp }}/site
        env:
          RUSTANGO_PASSWORD: theme-smoke-test-password
          RUSTANGO_BIND: 127.0.0.1:8080
        run: |
          cargo build
          ./target/debug/site quickstart > server.log 2>&1 &
          for i in $(seq 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: demo.localhost' http://127.0.0.1:8080/ || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          grep -q 'starter theme applied' server.log || { cat server.log; exit 1; }
          bad=0
          for path in $(python3 -c "import sqlite3; print(' '.join(r[0] for r in sqlite3.connect('var/demo.db').execute('select url_path from cms_page')))") /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: demo.localhost' "http://127.0.0.1:8080$path")
            echo "$code $path"
            [ "$code" = 200 ] || bad=$((bad+1))
          done
          [ "$bad" = 0 ] || { cat server.log; exit 1; }
          # A block that fails to render leaves the page at 200 and only
          # logs a warning, so look for that too.
          if grep -q 'failed to render' server.log; then grep 'failed to render' server.log; exit 1; fi

  windows:
    # A new user's first run on Windows, in PowerShell, exactly as the docs
    # say: generate a project, `cargo build`, `quickstart` (no variables to
    # set, no flags), then sign in. From crates.io on the schedule; dispatch with
    # source=checkout to try this repo's code before it is published.
    name: windows first run (${{ inputs.source || 'crates' }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install the scaffolder
        shell: pwsh
        run: |
          if ("${{ inputs.source }}" -eq "checkout") { cargo install --locked --path crates/rcms-scaffold }
          else { cargo install --locked rcms-scaffold }
          rcms --version
      - name: generate a project
        shell: pwsh
        run: |
          $scaffold = "new", "site_web", "--dir", $env:RUNNER_TEMP
          if ("${{ inputs.source }}" -eq "checkout") { $scaffold += "--local" }
          rcms @scaffold
          Get-Content "$env:RUNNER_TEMP\site_web\Cargo.toml" | Select-String "rustango"
      - name: build
        shell: pwsh
        working-directory: ${{ runner.temp }}\site_web
        run: cargo build
      - name: quickstart and sign in
        shell: pwsh
        working-directory: ${{ runner.temp }}\site_web
        env:
          # create-superuser reads the password from here instead of asking.
          RUSTANGO_PASSWORD: windows-smoke-test-password
          RUSTANGO_BIND: 127.0.0.1:8080
        run: |
          $server = Start-Process -FilePath "target\debug\site_web.exe" -ArgumentList "quickstart" `
            -RedirectStandardOutput server.log -RedirectStandardError server.err -PassThru
          $h = "Host: demo.localhost:8080"
          $ok = $false
          foreach ($i in 1..60) {
            $code = curl.exe -s -o NUL -w "%{http_code}" -H $h http://127.0.0.1:8080/login
            if ($code -eq "200") { $ok = $true; break }
            if ($server.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Get-Content server.log, server.err; throw "server never answered /login" }
          $page = curl.exe -s -c jar.txt -b jar.txt -H $h http://127.0.0.1:8080/login
          $csrf = [regex]::Match($page, 'name="_csrf" value="([^"]*)"').Groups[1].Value
          $login = curl.exe -s -o NUL -w "%{http_code} %{redirect_url}" -c jar.txt -b jar.txt -H $h `
            --data-urlencode "_csrf=$csrf" --data-urlencode "username=admin" `
            --data-urlencode "password=windows-smoke-test-password" `
            --data-urlencode "next=/cms-admin/pages" http://127.0.0.1:8080/login
          $admin = curl.exe -s -o NUL -w "%{http_code}" -b jar.txt -H $h http://127.0.0.1:8080/cms-admin/pages
          "login: $login  admin: $admin"
          # quickstart runs the server as a child process; stop both.
          taskkill /T /F /PID $server.Id | Out-Null
          if (-not $login.StartsWith("303") -or $admin -ne "200") { Get-Content server.log, server.err; throw "sign-in failed" }
