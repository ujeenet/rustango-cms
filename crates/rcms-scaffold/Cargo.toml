[package]
name = "rcms-scaffold"
version = "0.4.0"
description = "Create a new Rustango-CMS site: `rcms new <name>`"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://cms.rustango.com/getting-started"
authors.workspace = true
rust-version.workspace = true
keywords = ["cms", "rustango", "scaffold", "cli"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

# Released in step with rustango-cms: same version, and generated projects
# depend on rustango-cms `major.minor` of this version.

[package.metadata.rcms-scaffold]
# The framework requirement generated projects use. Must match what
# rustango-cms requires (a test compares it with the workspace manifest).
rustango = "0.65"

[dependencies]
# Expands a starter theme's `theme.json` (page-type names → definitions).
serde_json = "1"

[[bin]]
name = "rcms"
path = "src/main.rs"

[lints]
workspace = true
