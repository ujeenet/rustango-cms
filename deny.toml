# cargo-deny policy: `cargo deny check licenses bans`.
# Security advisories are checked by `cargo audit` (ignores in .cargo/audit.toml).

[graph]
all-features = true

[licenses]
# Every dependency must be available under at least one of these.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # BSD-style, OSI approved: libfuzzer-sys, via the AVIF encoder (rav1e).
    "NCSA",
    # File-level copyleft, used unmodified: cssparser and dtoa-short, via
    # the ammonia HTML sanitiser.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are reported, not refused: several come from
# the framework's own dependency tree.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry a version, so they are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
